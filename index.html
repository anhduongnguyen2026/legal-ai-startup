<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LegalAI - Trợ lý Pháp lý Thông minh</title>
    <style>
        :root {
            --primary-color: #1a365d;
            --secondary-color: #2b6cb0;
            --accent-color: #d69e2e;
            --bg-color: #f7fafc;
            --text-color: #2d3748;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
        }
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 2rem 1rem;
            text-align: center;
        }
        header h1 { margin: 0; font-size: 2.5rem; }
        header p { margin-top: 0.5rem; font-size: 1.2rem; color: var(--accent-color); }
        nav {
            background-color: var(--secondary-color);
            padding: 0.5rem;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        nav a:hover { color: var(--accent-color); }
        .container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 20px;
        }
        section {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h2 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 8px;
        }
        .ai-badge {
            display: inline-block;
            background-color: #e2e8f0;
            color: #4a5568;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-top: 5px;
            font-weight: 500;
        }
        .img-container {
            text-align: center;
            margin: 20px 0;
        }
        .img-container img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            max-width: 100%;
            background: #000;
            border-radius: 8px;
        }
        .video-container iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        table, th, td { border: 1px solid #cbd5e0; }
        th, td { padding: 12px; }
        /* Căn giữa cho tiêu đề bảng và các cột STT, MSSV */
        th, td:nth-child(1), td:nth-child(3) { text-align: center; }
        /* Cột Họ và tên: Căn trái và giữ trên 1 hàng không bị rớt dòng */
        td:nth-child(2) { text-align: left; white-space: nowrap; }
        /* Cột Phân công nhiệm vụ căn trái */
        td:nth-child(4) { text-align: left; }
        th { background-color: #edf2f7; color: var(--primary-color); }
        footer {
            text-align: center;
            padding: 20px;
            background-color: var(--primary-color);
            color: white;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>LegalAI</h1>
        <p>Trợ lý Pháp lý Thông minh cho Startup & Cộng đồng</p>
    </header>

    <nav>
        <a href="#y-tuong">1. Ý tưởng khởi nghiệp</a>
        <a href="#nhan-dien">2. Bộ nhận diện</a>
        <a href="#video">3. Video minh họa</a>
        <a href="#thong-tin-nhom">4. Thông tin nhóm</a>
    </nav>

    <div class="container">

        <!-- MỤC 1: Ý TƯỞNG KHỞI NGHIỆP -->
        <section id="y-tuong">
            <h2>1. Ý tưởng khởi nghiệp</h2>
            <p><strong>Vấn đề thực tiễn:</strong> Hệ thống văn bản quy phạm pháp luật tại Việt Nam vô cùng đồ sộ, phức tạp và thường
